version: "0.5.1"
description: Heapwatch Connector for ESP-IDF
url: https://github.com/viktorjamrich/heapwatch-connector-espidf
documentation: https://docs.heapwatch.com/integration/getting-started/overview
repository: git@github.com:viktorjamrich/heapwatch-connector-espidf.git
dependencies:
  # ESP-IDF 6 removed the built-in `json` component; use managed cJSON instead.
  # On IDF 5.x, CMakeLists.txt links the built-in `json` component (same library).
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: idf_version >= 6.0
  idf:
    version: ">=5.1.0"
